<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Garage — Supercar Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#0D0F12;
    --asphalt-2:#161A1F;
    --amber:#FFB800;
    --amber-dim:#8a6600;
    --red:#E8402C;
    --steel:#8A93A0;
    --paper:#F2EFE9;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    background:var(--asphalt);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app{position:fixed; inset:0;}

  /* ---------- Garage door intro ---------- */
  #doorTop, #doorBottom{
    position:fixed; left:0; right:0; height:52%;
    background:
      repeating-linear-gradient(180deg, #23272E 0 10px, #1A1D22 10px 20px);
    z-index:100;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.6);
    transition: transform 1.4s cubic-bezier(.77,0,.18,1);
  }
  #doorTop{top:0; border-bottom:4px solid #05070a;}
  #doorBottom{bottom:0; border-top:4px solid #05070a;}
  #doorTop.open{transform:translateY(-100%);}
  #doorBottom.open{transform:translateY(100%);}
  #doorLabel{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:101; text-align:center;
    font-family:'Rajdhani',sans-serif; font-weight:700;
    letter-spacing:0.15em;
    color:var(--amber);
    pointer-events:none;
    transition:opacity .5s ease;
  }
  #doorLabel .big{font-size:clamp(28px,6vw,56px); display:block;}
  #doorLabel .small{font-size:clamp(11px,2vw,14px); color:var(--steel); letter-spacing:0.3em; margin-top:6px; display:block;}
  #doorLabel.hide{opacity:0;}

  /* ---------- Top bar ---------- */
  #topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px;
    pointer-events:none;
  }
  #logo{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px;
    letter-spacing:0.08em;
    display:flex; align-items:center; gap:8px;
    pointer-events:auto;
  }
  #logo .dot{width:9px;height:9px;border-radius:50%;background:var(--red); box-shadow:0 0 10px var(--red);}

  #btnSound{
    pointer-events:auto;
    display:flex; align-items:center; gap:8px;
    background:rgba(22,26,31,0.8);
    border:1px solid rgba(138,147,160,0.25);
    border-radius:100px;
    padding:10px 18px;
    backdrop-filter: blur(6px);
    font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13px;
    letter-spacing:0.06em; text-transform:uppercase;
    color:var(--paper);
    cursor:pointer;
    transition:all .2s ease;
  }
  #btnSound:hover{border-color:var(--amber); color:var(--amber);}
  #btnSound.playing{background:var(--amber); color:var(--asphalt); border-color:var(--amber);}
  #btnSound.playing .icon{animation:soundPulse 0.6s ease-in-out infinite;}
  @keyframes soundPulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.2);}}
  #btnSound .icon{font-size:15px;}

  /* ---------- Car info panel ---------- */
  #infoPanel{
    position:fixed; left:24px; bottom:120px; z-index:20;
    max-width:340px;
    pointer-events:none;
  }
  #infoPanel .eyebrow{
    font-family:'Rajdhani',sans-serif; font-weight:600; font-size:12px;
    letter-spacing:0.25em; color:var(--red); text-transform:uppercase;
    margin-bottom:4px;
  }
  #infoPanel h1{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:clamp(28px,4vw,44px);
    line-height:1; color:var(--paper);
    text-shadow:0 2px 24px rgba(0,0,0,0.6);
  }
  #infoPanel .stats{
    display:flex; gap:22px; margin-top:14px;
  }
  #infoPanel .stat .val{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; color:var(--amber);}
  #infoPanel .stat .lbl{font-size:10px; letter-spacing:0.12em; color:var(--steel); text-transform:uppercase;}

  /* ---------- Hint text ---------- */
  #hint{
    position:fixed; bottom:170px; right:24px; z-index:20;
    font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13px;
    letter-spacing:0.05em; color:var(--steel);
    text-align:right; max-width:220px;
    pointer-events:none;
    transition:opacity .4s ease;
  }
  #hint .key{color:var(--amber);}

  /* ---------- Gallery strip ---------- */
  #gallery{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    padding:16px 20px 20px;
    background:linear-gradient(180deg, transparent, rgba(5,7,10,0.85) 40%);
    display:flex; gap:10px; overflow-x:auto;
    scrollbar-width:none;
  }
  #gallery::-webkit-scrollbar{display:none;}
  .car-card{
    flex:0 0 auto;
    width:104px; height:72px;
    border-radius:10px;
    background:var(--asphalt-2);
    border:2px solid transparent;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:transform .2s ease, border-color .2s ease;
    display:flex; align-items:center; justify-content:center;
  }
  .car-card:hover{transform:translateY(-4px);}
  .car-card.active{border-color:var(--amber);}
  .car-card .swatch{width:34px; height:34px; border-radius:8px;}
  .car-card .name{
    position:absolute; bottom:4px; left:0; right:0; text-align:center;
    font-family:'Rajdhani',sans-serif; font-weight:600; font-size:10px;
    letter-spacing:0.04em; color:var(--paper);
  }

  /* ---------- Loading ---------- */
  #loading{
    position:fixed; inset:0; z-index:200;
    background:var(--asphalt);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    transition:opacity .6s ease;
  }
  #loading .spinner{
    width:40px; height:40px; border-radius:50%;
    border:3px solid rgba(255,184,0,0.2);
    border-top-color:var(--amber);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #loading .txt{font-family:'Rajdhani',sans-serif; letter-spacing:0.2em; font-size:12px; color:var(--steel); text-transform:uppercase;}
  #loading.hide{opacity:0; pointer-events:none;}

  /* ---------- Mobile ---------- */
  @media (max-width:640px){
    #infoPanel{bottom:150px; left:16px;}
    #hint{display:none;}
    #gallery{padding:10px 12px 14px;}
    .car-card{width:82px; height:58px;}
    #topbar{padding:14px 16px;}
    #btnSound span.label{display:none;}
    #btnSound{padding:10px 14px;}
  }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><div class="txt">Opening the garage</div></div>

<div id="doorTop"></div>
<div id="doorBottom"></div>
<div id="doorLabel">
  <span class="big">THE GARAGE</span>
  <span class="small">Tap a car below · Drag to rotate · Tap the car for engine sound</span>
</div>

<div id="app"></div>

<div id="topbar">
  <div id="logo"><span class="dot"></span>THE GARAGE</div>
  <button id="btnSound"><span class="icon">🔊</span><span class="label">Rev Engine</span></button>
</div>

<div id="infoPanel">
  <div class="eyebrow">Now viewing</div>
  <h1 id="carName">—</h1>
  <div class="stats">
    <div class="stat"><div class="val" id="statTop">—</div><div class="lbl">Top speed</div></div>
    <div class="stat"><div class="val" id="statZero">—</div><div class="lbl">0–100</div></div>
    <div class="stat"><div class="val" id="statPower">—</div><div class="lbl">Power</div></div>
  </div>
</div>

<div id="hint"><span class="key">Drag</span> to spin the car · <span class="key">Scroll</span> to zoom · <span class="key">Tap</span> the car to hear it</div>

<div id="gallery"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./cars.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
